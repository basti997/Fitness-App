<div *ngIf="workout" class="workout-card"> 
    <h2>📋 Current Workout</h2> 
    
    <p class="meta"> 
        Workout #{{ workout.workout_id }} 
        · {{ workout.workout_date | date: 'medium' }} </p>
    <label class="notes-label">Notes during workout:</label>
    
    <textarea 
    class="notes-input" 
    rows="4" 
    [ngModel]="notes" 
    (ngModelChange)="onNotesChange($event)" 
    placeholder="Write how you feel, focus, etc."> 

    </textarea> 
    
    <div class="exercise-actions" *ngIf="workout">
      <button 
          class="btn add-exercises-btn" 
          (click)="addExercises()">
          + Add Exercises
      </button>
      
      <app-musclegroup-selector 
          #muscleGroupSelector
          (exerciseAdded)="onExerciseAdded($event)"
          (overlayClosed)="onOverlayClosed()">
      </app-musclegroup-selector>
  </div>

    <div class="actions"> 
        <button class="btn finish-btn" (click)="onFinishClicked()"> 
            ✅ Finish Workout </button> 
        </div> 
    </div>
