<!DOCTYPE html>
<html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workout Tracker</title>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
          <h1>{{ title() }}</h1>
          <p>Track your progress. Build your strength.</p>
        </div>
      
        <!-- User Section -->
        <div class="section">
          <h2>👤 User Information</h2>
          <app-user-card (userChange)="onUserChanged($event)"></app-user-card>
          
          <div style="text-align: center; margin-top: 20px;">
            <button class="btn" (click)="startNewWorkout()" 
                    [disabled]="!user">
              🚀 Start New Workout
            </button>
          </div>
        </div>
      
        <!-- Active Workout -->
        <div class="section" *ngIf="activeWorkout">
          <h2>📋 Current Workout</h2>
          
          <app-workout-card
            [workout]="activeWorkout"
            [notes]="activeNotes"
            (notesChange)="onActiveNotesChange($event)"
            (finish)="finishActiveWorkout()">
          </app-workout-card>
          
      
          <!-- WorkoutSetTracker: Your set tracker! -->
          <app-workoutset-tracker 
            [workout]="activeWorkout"
            [user]="user">
          </app-workoutset-tracker>
        </div>
      
        <!-- Past Workouts -->
        <div class="section" *ngIf="!activeWorkout">
          <h2>📜 Workout History</h2>
          <app-workout-list [workouts]="workouts"></app-workout-list>
        </div>
      
        <!-- Progress Stats (Static for now)
        <div class="section">
          <h2>📊 Progress</h2>
          <div class="progress-grid">
            <div class="progress-card">
              <div class="progress-number">{{ workouts.length }}</div>
              <p>Total Workouts</p>
            </div>
            <div class="progress-card">
              <div class="progress-number">{{ user?.totalSets || 0 }}</div>
              <p>Total Sets Logged</p>
            </div>
          </div>
        </div> -->
      </div>
      
</body>
</html>
