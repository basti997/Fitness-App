<!DOCTYPE html>
<html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workout Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .section {
            padding: 30px;
            border-bottom: 1px solid #eee;
        }
        
        .section:last-child {
            border-bottom: none;
        }
        
        .section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5em;
        }
        
        .user-info {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.2s;
            display: inline-block;
            text-decoration: none;
        }
        
        .btn:hover {
            transform: translateY(-2px);
        }
        
        .btn-secondary {
            background: #6c757d;
        }
        
        .muscle-groups {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        
        .muscle-group {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            border: 2px solid transparent;
            transition: all 0.3s;
        }
        
        .muscle-group:hover {
            border-color: #4facfe;
            transform: translateY(-5px);
        }
        
        .muscle-group h3 {
            color: #495057;
            margin-bottom: 10px;
        }
        
        .exercises {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        
        .exercise {
            background: white;
            padding: 20px;
            border-radius: 12px;
            border: 2px solid #e9ecef;
            transition: all 0.3s;
        }
        
        .exercise:hover {
            border-color: #4facfe;
            box-shadow: 0 10px 25px rgba(79, 172, 254, 0.2);
        }
        
        .exercise h4 {
            color: #333;
            margin-bottom: 8px;
        }
        
        .exercise p {
            color: #666;
            font-size: 14px;
        }
        
        .sets-container {
            margin-top: 20px;
        }
        
        .set-entry {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: flex;
            gap: 15px;
            align-items: center;
        }
        
        .set-input {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr 80px;
            gap: 10px;
        }
        
        .set-input input {
            padding: 10px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 16px;
        }
        
        .set-input input:focus {
            outline: none;
            border-color: #4facfe;
        }
        
        .current-workout {
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            padding: 25px;
            border-radius: 12px;
            margin-top: 20px;
        }
        
        .progress-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .progress-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
        }
        
        .progress-number {
            font-size: 2.5em;
            font-weight: bold;
            color: #4facfe;
        }
        
        @media (max-width: 768px) {
            .container {
                margin: 10px;
                border-radius: 15px;
            }
            
            .header h1 {
                font-size: 2em;
            }
            
            .section {
                padding: 20px;
            }
            
            .set-input {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
          <h1>{{ title() }}</h1>
          <p>Track your progress. Build your strength.</p>
        </div>
      
        <!-- User Section -->
        <div class="section">
          <h2>👤 User Information</h2>
          <app-user-card (userChange)="onUserChanged($event)"></app-user-card>
          
          <div style="text-align: center; margin-top: 20px;">
            <button class="btn" (click)="startNewWorkout()" 
                    [disabled]="!user">
              🚀 Start New Workout
            </button>
          </div>
        </div>
      
        <!-- Active Workout -->
        <div class="section" *ngIf="activeWorkout">
          <h2>📋 Current Workout</h2>
          
          <app-workout-card
            [workout]="activeWorkout"
            [notes]="activeNotes"
            (notesChange)="onActiveNotesChange($event)"
            (finish)="finishActiveWorkout()">
          </app-workout-card>
      
          <!-- WorkoutSetTracker: Your set tracker! -->
          <app-workoutset-tracker 
            [workout]="activeWorkout"
            [user]="user">
          </app-workoutset-tracker>
        </div>
      
        <!-- Past Workouts -->
        <div class="section" *ngIf="!activeWorkout">
          <h2>📜 Workout History</h2>
          <app-workout-list [workouts]="workouts"></app-workout-list>
        </div>
      
        <!-- Progress Stats (Static for now)
        <div class="section">
          <h2>📊 Progress</h2>
          <div class="progress-grid">
            <div class="progress-card">
              <div class="progress-number">{{ workouts.length }}</div>
              <p>Total Workouts</p>
            </div>
            <div class="progress-card">
              <div class="progress-number">{{ user?.totalSets || 0 }}</div>
              <p>Total Sets Logged</p>
            </div>
          </div>
        </div> -->
      </div>
      
</body>
</html>
