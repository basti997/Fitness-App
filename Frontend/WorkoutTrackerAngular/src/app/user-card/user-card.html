<div class="user-card-wrapper">
  <!-- Safe binding: use local `user` when lastSavedUser is present -->
  <div class="user-summary" *ngIf="lastSavedUser as user; else notLoggedIn">
    <div class="avatar-circle">
      {{ (user.userName?.charAt(0) || '?') | uppercase }}
    </div>
    <div class="user-summary-text">
      <div class="user-summary-name">{{ user.userName }}</div>
      <div class="user-summary-meta">
        ID: {{ user.id }} · Joined {{ user.createdAt | date:'mediumDate' }}
      </div>
    </div>
  </div>

  <ng-template #notLoggedIn>
    <div class="user-summary-placeholder">
      <p>No user logged in yet.</p>
    </div>
  </ng-template>

  <div class="user-actions">
    <button class="btn btn-primary large" (click)="openLogin()">
      {{ loginButtonLabel }}
    </button>
  </div>
</div>

<!-- Login / Create popup -->
<div class="popup-backdrop" *ngIf="showUserPopup">
  <div class="popup-window">
    <h2>Login / Create User</h2>

    <form (ngSubmit)="saveUser()">
      <div class="form-row">
        <label for="username">Username:</label>
        <input id="username" type="text" [(ngModel)]="user.userName" name="username" required />
      </div>

      <div class="form-row">
        <label for="email">Email:</label>
        <input id="email" type="email" [(ngModel)]="user.eMail" name="email" required />
      </div>

      <div class="form-row">
        <label for="password">Password:</label>
        <input id="password" type="password" [(ngModel)]="user.password" name="password" required minlength="6" />
      </div>

      <div class="form-row">
        <label>Created At (auto):</label>
        <input type="text" [value]="user.createdAt | date:'yyyy-MM-dd HH:mm:ss'" disabled />
      </div>

      <div class="popup-actions">
        <button type="submit" class="btn">Save Profile</button>
        <button type="button" class="btn btn-secondary" (click)="cancel()">Cancel</button>
      </div>
    </form>
  </div>
</div>
