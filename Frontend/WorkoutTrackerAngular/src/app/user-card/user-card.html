<div class="user-card-wrapper">
  <div class="user-summary" *ngIf="lastSavedUser; else notLoggedIn">
    <div class="avatar-circle">
      {{ lastSavedUser.userName.charAt(0) | uppercase }}
    </div>
    <div class="user-summary-text">
      <div class="user-summary-name">{{ lastSavedUser.userName }}</div>
      <div class="user-summary-meta">
        ID: {{ lastSavedUser.id }} · Joined {{ lastSavedUser.createdAt | date:'mediumDate' }}
      </div>
    </div>
  </div>

  <ng-template #notLoggedIn>
    <div class="user-summary-placeholder">
      <p>No user logged in yet.</p>
    </div>
  </ng-template>

  <div class="user-actions">
    <button class="btn btn-primary large" (click)="openLogin()">
      {{ loginButtonLabel }}
    </button>
  </div>
</div>

<div class="popup-backdrop" *ngIf="showUserPopup">
  <div class="popup-window">
    <h2>Login / Create User</h2>

    <form (ngSubmit)="saveUser()">
      <div class="form-row">
        <label>Username:</label>
        <input type="text" [(ngModel)]="user.userName" name="username" required>
      </div>

      <div class="form-row">
        <label>Email:</label>
        <input type="email" [(ngModel)]="user.eMail" name="email" required>
      </div>

      <div class="form-row">
        <label>Password:</label>
        <input type="password" [(ngModel)]="user.passwordHash" name="password_hash">
      </div>

      <div class="form-row">
        <label>Created At (auto):</label>
        <input type="text" [value]="user.createdAt | date:'yyyy-MM-dd HH:mm:ss'" disabled>
      </div>

      <div class="popup-actions">
        <button type="submit" class="btn" (click)="saveUser(); $event.preventDefault()">Save Profile</button>
        <button type="button" class="btn btn-secondary" (click)="cancel()">Cancel</button>
      </div>
    </form>
  </div>
</div>
